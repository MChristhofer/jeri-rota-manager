name: Verificação da Central WhatsApp
on:
  pull_request:
    paths:
      - 'atendimento.html'
      - 'atendimento.js'
      - 'atendimento-whatsapp.css'
      - 'tests/test_atendimento_whatsapp.py'
      - '.github/workflows/check-central-whatsapp.yml'
jobs:
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: node --check atendimento.js
      - name: Conferir interface e funcionalidades
        run: python3 -m unittest discover -s tests -p test_atendimento_whatsapp.py -v
