<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrar | JeriRota Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <p class="eyebrow">JERI ROTA</p>
      <h1>Manager</h1>
      <p class="subtitle">Acesso interno ao sistema de operações.</p>
      <form id="loginForm" novalidate>
        <label>E-mail<input id="email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin@jerirota.com.br" required></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="loginButton" type="submit">Entrar</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
      <small class="security-note">Acesso protegido pelo Supabase Auth.</small>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
