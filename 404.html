<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeri Rota</title></head><body><script>const match=location.pathname.match(/\/v\/([^/]+)\/?$/);if(match){location.replace(`${location.origin}${location.pathname.replace(/\/v\/[^/]+\/?$/,'/v/')}?token=${encodeURIComponent(match[1])}`)}else{location.replace(`${location.origin}/`)}</script></body></html>
